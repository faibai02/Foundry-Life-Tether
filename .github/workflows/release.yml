name: Release Creation

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Substitute Version in module.json
        run: |
          sed -i "s/{{version}}/${{ github.ref_name }}/g" module.json

      - name: Create Module Zip
        run: |
          mkdir -p package/life-tether-spell
          cp -r scripts module.json README.md package/life-tether-spell/
          cd package
          zip -r ../life-tether-spell.zip life-tether-spell

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            life-tether-spell.zip
            module.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
